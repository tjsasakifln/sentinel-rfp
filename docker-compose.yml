version: '3.9'

services:
  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_password
      POSTGRES_DB: sentinel_rfp
      POSTGRES_INITDB_ARGS: '-U sentinel_user'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel_user -d sentinel_rfp']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sentinel-network

  # PgBouncer - Connection pooling for PostgreSQL
  # Routes application connections through a pool to reduce connection overhead
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: sentinel-pgbouncer
    restart: unless-stopped
    ports:
      - '6432:6432'
    environment:
      # Database connection (points to postgres service)
      DATABASE_URL: postgres://sentinel_user:sentinel_password@postgres:5432/sentinel_rfp
      # Pooling mode: transaction (fastest, recommended for web apps)
      # - transaction: Connection returned to pool after each transaction (best performance)
      # - session: Connection held until client disconnects (use for prepared statements)
      # - statement: Connection returned after each statement (most aggressive, breaks transactions)
      POOL_MODE: transaction
      # Maximum connections per user+database pair (default: 100)
      MAX_CLIENT_CONN: 1000
      # Maximum server connections to PostgreSQL (limits backend load)
      DEFAULT_POOL_SIZE: 25
      # Reserve pool for emergencies (connections kept open for priority use)
      RESERVE_POOL_SIZE: 5
      # Server lifetime: Close server connections after this time (seconds)
      # Prevents connection leaks and stale connections
      SERVER_LIFETIME: 3600
      # Query timeout: Cancel queries running longer than this (seconds)
      # Prevents runaway queries from blocking the pool
      QUERY_TIMEOUT: 60
      # Log connections and disconnections
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      # Stats period (how often to log pool stats, in seconds)
      STATS_PERIOD: 60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel-network

  # Redis 7.x for caching and BullMQ job queues
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sentinel-network

  # Meilisearch 1.x for full-text search
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: sentinel-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: sentinel_meili_master_key_dev_only
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:7700/health']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sentinel-network

# Named volumes for data persistence
volumes:
  postgres_data:
    name: sentinel_postgres_data
    driver: local
  redis_data:
    name: sentinel_redis_data
    driver: local
  meilisearch_data:
    name: sentinel_meilisearch_data
    driver: local

# Isolated network for services
networks:
  sentinel-network:
    name: sentinel_network
    driver: bridge
