# docker-compose.override.yml
# This file is automatically loaded by Docker Compose and can be used for local overrides
# Add this to .gitignore if you want personal customizations

version: '3.9'

services:
  postgres:
    # Override port if 5432 is already in use locally
    # ports:
    #   - '5433:5432'

    # Enable PostgreSQL query logging for development
    # command: postgres -c log_statement=all -c log_destination=stderr

    # Additional environment variables
    # environment:
    #   POSTGRES_HOST_AUTH_METHOD: trust  # WARNING: Only for local development!

  redis:
    # Override Redis port if needed
    # ports:
    #   - '6380:6379'

    # Increase max memory for local development
    # command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru

  meilisearch:
    # Override Meilisearch port if needed
    # ports:
    #   - '7701:7700'

    # Disable analytics in local environment
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'

