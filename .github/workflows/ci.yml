name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint - Verifica qualidade do código com ESLint
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint via Turborepo
        run: pnpm lint

  # Job 2: Type Check - Verifica tipos TypeScript
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          cd packages/database
          pnpm prisma generate

      - name: Run TypeScript Type Check via Turborepo
        run: pnpm typecheck

  # Job 3: Test - Executa testes unitários de todos os apps/packages
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          cd packages/database
          pnpm prisma generate

      - name: Run Tests via Turborepo
        run: pnpm test

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/api/coverage/coverage-final.json,./apps/web/coverage/coverage-final.json
          flags: unittests
          name: codecov-sentinel-rfp
          fail_ci_if_error: false

  # Job 4: Build - Builda todos os apps e packages do monorepo
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          cd packages/database
          pnpm prisma generate

      - name: Build All via Turborepo
        run: pnpm build

      - name: Verify Build Artifacts
        run: |
          echo "✓ Verifying build artifacts..."
          test -d apps/api/dist && echo "✓ API build artifacts exist"
          test -d apps/web/.next && echo "✓ Web build artifacts exist"
          echo "✓ All build artifacts verified"

  # Job 5: Validate - Validação completa do monorepo com testes E2E
  validate:
    name: Validate Monorepo Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build]

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_dev_pass
          POSTGRES_DB: sentinel_rfp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_rfp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configuration files
        run: |
          echo "✓ Validating monorepo configuration..."
          test -f package.json && echo "✓ package.json exists"
          test -f pnpm-workspace.yaml && echo "✓ pnpm-workspace.yaml exists"
          test -f turbo.json && echo "✓ turbo.json exists"
          test -f tsconfig.json && echo "✓ tsconfig.json exists"
          test -f .eslintrc.json && echo "✓ .eslintrc.json exists"
          test -f .prettierrc && echo "✓ .prettierrc exists"
          test -d apps && echo "✓ apps/ directory exists"
          test -d packages && echo "✓ packages/ directory exists"
          echo "✓ All configuration files validated"

      - name: Generate Prisma Client
        run: |
          cd packages/database
          pnpm prisma generate
        env:
          DATABASE_URL: postgresql://sentinel:sentinel_dev_pass@localhost:5432/sentinel_rfp_test

      - name: Run Database Migrations
        run: |
          cd packages/database
          pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sentinel:sentinel_dev_pass@localhost:5432/sentinel_rfp_test

      - name: Run E2E Tests
        run: |
          cd apps/api
          pnpm test:e2e
        env:
          DATABASE_URL: postgresql://sentinel:sentinel_dev_pass@localhost:5432/sentinel_rfp_test
          NODE_ENV: test
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

      - name: Summary
        run: |
          echo "✅ Lint checks passed"
          echo "✅ Type checks passed"
          echo "✅ Monorepo setup validation completed"
          echo "✅ Database migrations applied"
          echo "✅ E2E tests passed"
          echo "📦 Ready for production deployment"
