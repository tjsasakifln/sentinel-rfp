name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: Deploy - Deploy to Railway Staging Environment
  deploy:
    name: Deploy to Railway (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy if CI workflow passed successfully
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    environment:
      name: staging
      url: https://sentinel-rfp-staging.up.railway.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          cd packages/database
          pnpm prisma generate

      - name: Build All via Turborepo
        run: pnpm build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (Staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Deploying to Railway Staging Environment..."
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --service backend --environment staging
          railway up --service frontend --environment staging

      - name: Get Deployment URLs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "📦 Deployment completed successfully!"
          echo "🌐 Backend URL: $(railway domain --service backend --environment staging)"
          echo "🌐 Frontend URL: $(railway domain --service frontend --environment staging)"

      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to Railway Staging: SUCCESS"
            echo "📊 View logs: https://railway.app/project/${{ secrets.RAILWAY_PROJECT_ID }}"
          else
            echo "❌ Deployment to Railway Staging: FAILED"
            echo "📊 Check logs: https://railway.app/project/${{ secrets.RAILWAY_PROJECT_ID }}"
          fi

      - name: Summary
        if: success()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to Railway Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend (NestJS API)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend (Next.js Web)" >> $GITHUB_STEP_SUMMARY
